name: Verify Repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-structure:
    name: Verify Structure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          REQUIRED=(README.md LICENSE SentinelX.py requirements.txt install.sh pyproject.toml Dockerfile)
          MISSING=0
          for file in "${REQUIRED[@]}"; do
            if [ -f "$file" ]; then echo "  OK $file"; else echo "  MISSING $file"; MISSING=$((MISSING+1)); fi
          done
          if [ $MISSING -gt 0 ]; then exit 1; fi

      - name: Check modules
        run: |
          COUNT=$(find modules -name "*.py" -not -name "__init__.py" | wc -l)
          echo "Modules: $COUNT"
          if [ "$COUNT" -lt 20 ]; then exit 1; fi

      - name: Check tests
        run: |
          COUNT=$(find tests -name "test_*.py" | wc -l)
          echo "Tests: $COUNT"
          if [ "$COUNT" -lt 3 ]; then exit 1; fi

  verify-imports:
    name: Verify Imports
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install psutil phonenumbers requests

      - name: Test imports
        run: |
          for mod in env_detect process network files persistence resources ioc_hunter mitre_attack cache_db; do
            python -c "from modules.$mod import *" && echo "  OK $mod" || exit 1
          done

  verify-tests:
    name: Verify Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install psutil phonenumbers requests pytest

      - name: Run tests
        run: pytest tests/ -v
