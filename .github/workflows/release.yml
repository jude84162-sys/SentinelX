name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install psutil phonenumbers

      - name: Create release archive
        run: |
          mkdir -p release
          cp -r modules SentinelX.py README.md LICENSE requirements.txt release/ 2>/dev/null || true
          cd release && tar -czf ../sentinelx-${{ github.ref_name }}.tar.gz *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: sentinelx-${{ github.ref_name }}.tar.gz
          generate_release_notes: true

