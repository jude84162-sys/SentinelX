name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil phonenumbers pytest flake8
          pip install -e . || true

      - name: Lint with flake8
        run: |
          flake8 modules/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Test imports
        run: |
          python -c "from modules.env_detect import get_environment; print('OK')"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short || echo "No tests yet"
        continue-on-error: true
