[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelx"
version = "2.1.0"
description = "Modular Enterprise Blue Team Suite - Cross-platform security triage"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "jude84162-sys", email = "jude84162@gmail.com"}
]
keywords = [
    "security", "blueteam", "incident-response", "forensics",
    "malware", "triage", "android", "termux", "kali", "wsl"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "psutil>=5.9.0",
    "phonenumbers>=8.13.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
yara = ["yara-python>=4.3.0"]
web = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
tui = ["textual>=0.40.0"]
full = [
    "yara-python>=4.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "textual>=0.40.0",
]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/jude84162-sys/SentinelX"
Documentation = "https://github.com/jude84162-sys/SentinelX#readme"
Repository = "https://github.com/jude84162-sys/SentinelX"
Issues = "https://github.com/jude84162-sys/SentinelX/issues"
Changelog = "https://github.com/jude84162-sys/SentinelX/releases"

[project.scripts]
sentinelx = "cli:main"

[tool.setuptools]
py-modules = ["SentinelX", "cli"]
packages = ["modules"]

[tool.setuptools.package-data]
modules = ["*.py"]
"*" = ["*.md", "*.txt", "*.json"]
